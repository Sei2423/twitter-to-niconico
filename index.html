<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Camera</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>
<body>


<video id="video" autoplay playsinline muted></video>

<script>
async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 }
        },
        audio: false
    });

    document.getElementById("video").srcObject = stream;
}

startCamera().catch(console.error);
</script>

</body>
</html>
